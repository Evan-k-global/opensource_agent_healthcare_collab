services:
  lightnet:
    profiles: [chain]
    # Jan 2026 protocol-3 snapshot matching o1js 2.13 (8 zkApp fields).
    image: o1labs/mina-local-network@sha256:ea8ed42d7925ee37e840050416f2b6f72c8509664d371646880355a385e1b9b4
    environment:
      NETWORK_TYPE: single-node
      PROOF_LEVEL: none
      RUN_ARCHIVE_NODE: "false"
      LOG_LEVEL: Info
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:18181:8181"
    mem_limit: 6g
    # Lightnet uses its nonproduction proof-level-none mode. The application
    # independently verifies real proofs; node inclusion alone is not evidence
    # of full protocol proof enforcement. This is not a Zeko rollup.
